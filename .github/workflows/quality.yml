name: Nexora Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          pip install -e ".[dev]"



      - name: Mypy
        run: mypy .

      - name: Tests
        run: pytest -v