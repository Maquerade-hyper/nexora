services:

  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXORA_DB_NAME:-nexora}
      POSTGRES_USER: ${NEXORA_DB_USER:-nexora}
      POSTGRES_PASSWORD: ${NEXORA_DB_PASSWORD:-change-me}
    ports:
      - "${NEXORA_DB_PORT:-55432}:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXORA_DB_USER:-nexora} -d ${NEXORA_DB_NAME:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    ports:
      - "${NEXORA_REDIS_PORT:-56379}:6379"
    volumes:
      - nexora_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexora_postgres_data:
    name: nexora_postgres_data
  nexora_redis_data:
    name: nexora_redis_data
