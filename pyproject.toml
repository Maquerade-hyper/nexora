[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "0.0.0"
description = "Nexora - Visual Backend Engineering Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "mypy>=1.14",
    "pre-commit>=4.0"
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["nexora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
